[theme]
base = "dark"
primaryColor = "#22C55E"
backgroundColor = "#020617"
secondaryBackgroundColor = "#0F172A"
textColor = "#F8FAFC"
font = "sans serif"

[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false

[client]
# Oculta tracebacks internos al usuario en presentación (rutas del sistema)
showErrorDetails = false
